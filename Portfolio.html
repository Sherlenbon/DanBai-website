<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Dan Bai's Personal Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .menu {
            background-color: #5a2d82;
            color: white;
            padding: 20px 40px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .menu a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            background-color: white;
            padding: 30px;
            margin: 30px auto;
            width: 60%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }
        h1 {
            color: #5a2d82;
            font-size: 28px;
            font-weight: bold;
        }
        .project-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .project {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .project img {
            width: 100%;
            height: auto;
            display: block;
        }
        .project-title {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="Portfolio.html">My Projects</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- Portfolio Content -->
    <div class="container">
        <h1>Some of my recent projects</h1>
        <div class="project-grid">
            <div class="project">
                <img src="project1.jpg" alt="Project 1 Cover">
                <p class="project-title">Project 1: AI Dashboard</p>
            </div>
            <div class="project">
                <img src="project2.jpg" alt="Project 2 Cover">
                <p class="project-title">Project 2: Mobile App Design</p>
            </div>
            <div class="project">
                <img src="project3.jpg" alt="Project 3 Cover">
                <p class="project-title">Project 3: E-commerce Platform</p>
            </div>
            <div class="project">
                <img src="project4.jpg" alt="Project 4 Cover">
                <p class="project-title">Project 4: Educational SaaS</p>
            </div>
        </div>
    </div>
</body>
</html>
