<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Dan Bai's Personal Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .menu {
            background-color: #5a2d82;
            color: white;
            padding: 20px 40px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .menu a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            background-color: white;
            padding: 30px;
            margin: 30px auto;
            width: 60%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #5a2d82;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }
        .contact-form input, .contact-form textarea {
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
        }
        .contact-form button {
            background-color: #5a2d82;
            color: white;
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .contact-form button:hover {
            background-color: #472165;
        }
    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="Portfolio.html">My Projects</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- Contact Content -->
    <div class="container">
        <h1>Contact Me</h1>
        <form class="contact-form" action="mailto:youremail@example.com" method="post" enctype="text/plain">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
